# Continuous integration for CarbonRoute (remediation task M0.3).
#
# Runs the backend and frontend checks on every pull request and on pushes to
# the remediation, task and main branches. It only reads the repository: it
# needs no secrets and deploys nothing (deployment stays in deploy-pages.yml).
name: CI

on:
  pull_request:
    branches:
      - fix/prototype-flaws
      - main
  push:
    branches:
      - fix/prototype-flaws
      - main
      - 'task/**'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older, still-running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 (same major version as the Docker image)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (exactly as locked)
        run: npm ci --no-audit --no-fund

      - name: Typecheck source and tests
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 (same major version as the Pages deployment)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (exactly as locked)
        run: npm ci --no-audit --no-fund

      - name: Typecheck source and tests
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build for GitHub Pages (as deploy-pages.yml does)
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

  python:
    name: Python service checks (standard library only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: FastAPI CORS settings tests (M1.9)
        run: python -m unittest discover -s fastapi_service/tests -v
