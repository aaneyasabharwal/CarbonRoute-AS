# CarbonRoute STAGING on Render (P9). Nothing is created until the owner applies this Blueprint in
# the Render dashboard (New > Blueprint), which asks for every `sync: false` value.
#
# - It never touches the old, suspended service `carbonroute.onrender.com`.
# - Costs (Render pricing checked 2026-11-14): Hobby workspace $0; API instance 0.5 CPU / 512 MB
#   ($7/month); 1 GB persistent disk ($0.25/GB/month); the static site is free. A payment method is
#   required for the paid instance and disk.
# - Secrets are never in this file: JWT_SECRET is generated by Render, the others are entered once.
# - Free alternative (no disk, data lost on every restart or 15-minute idle spin-down): set
#   `plan: free` and remove the `disk:` block. See docs/STAGING.md.
services:
  - type: web
    name: carbonroute-staging-api
    runtime: node
    plan: 0.5c-512mb
    branch: fix/prototype-flaws
    autoDeployTrigger: off
    # NODE_ENV=production also applies to the build, where npm would then skip the TypeScript
    # compiler (a dev dependency); --include=dev keeps it.
    buildCommand: cd backend && npm ci --include=dev && npm run build
    # The disk exists only at runtime: seed the committed presentation PDFs without overwriting.
    startCommand: mkdir -p /var/data/uploads && cp -rn storage/uploads/presentations /var/data/uploads/ && cd backend && npm start
    healthCheckPath: /api/health
    disk:
      name: carbonroute-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # Only for the first start with an empty database; delete it afterwards.
      - key: ADMIN_PASSWORD
        sync: false
      # Exact staging frontend origin, e.g. https://carbonroute-staging-web.onrender.com (no slash).
      - key: CORS_ORIGIN
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: CARBONROUTE_DB_FILE
        value: /var/data/carbonroute.db.json
      - key: STORAGE_TYPE
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /var/data/uploads
      # Committed aggregate results (no user data), read-only from the checkout.
      - key: BENCHMARK_RESULTS_DIR
        value: ../results/published/benchmark-results
      - key: ML_RESULTS_DIR
        value: ../results/published/ml-results
      # Optional: live Electricity Maps data. Leave empty for the synthetic demo trace only.
      - key: ELECTRICITY_MAPS_API_KEY
        sync: false
      - key: EM_MAX_CALLS_PER_HOUR
        value: "60"
      - key: EM_MAX_CALLS_PER_DAY
        value: "500"

  - type: web
    name: carbonroute-staging-web
    runtime: static
    branch: fix/prototype-flaws
    autoDeployTrigger: off
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      # The API service URL, e.g. https://carbonroute-staging-api.onrender.com (no /api, no slash).
      - key: VITE_API_URL
        sync: false
    routes:
      # Single-page app: every path serves index.html (React Router handles it).
      - type: rewrite
        source: /*
        destination: /index.html
