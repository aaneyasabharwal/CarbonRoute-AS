# CarbonRoute STAGING on Render (P9). Nothing is created until the owner applies this Blueprint in
# the Render dashboard (New > Blueprint), which asks for every `sync: false` value.
#
# - It never touches the old, suspended service `carbonroute.onrender.com`.
# - OWNER CHOICE (2026-11-14): FREE plan, no persistent disk. Cost $0 (Hobby workspace, Free web
#   service, free static site). Accounts, jobs and uploads are LOST on every deploy, restart and after
#   15 minutes without traffic (spin-down); the admin is re-created at each start from ADMIN_PASSWORD,
#   which therefore stays set. Cold start after a spin-down takes about a minute.
# - Secrets are never in this file: JWT_SECRET is generated by Render, the others are entered once.
# - Persistent alternative (about $7.25/month, payment method needed): plan 0.5c-512mb plus
#   disk {name: carbonroute-data, mountPath: /var/data, sizeGB: 1} and the /var/data paths.
#   See docs/STAGING.md section 2.
services:
  - type: web
    name: carbonroute-staging-api
    runtime: node
    plan: free
    branch: fix/prototype-flaws
    autoDeployTrigger: off
    # NODE_ENV=production also applies to the build, where npm would then skip the TypeScript
    # compiler (a dev dependency); --include=dev keeps it.
    buildCommand: cd backend && npm ci --include=dev && npm run build
    # Data lives in the (ephemeral) checkout; seed the committed presentation PDFs at each start.
    startCommand: mkdir -p runtime-data/uploads && cp -rn storage/uploads/presentations runtime-data/uploads/ && cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # Free plan: the database starts empty after every restart, so this must STAY set.
      - key: ADMIN_PASSWORD
        sync: false
      # Exact staging frontend origin, e.g. https://carbonroute-staging-web.onrender.com (no slash).
      - key: CORS_ORIGIN
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: CARBONROUTE_DB_FILE
        value: ../runtime-data/carbonroute.db.json
      - key: STORAGE_TYPE
        value: local
      - key: LOCAL_STORAGE_DIR
        value: ../runtime-data/uploads
      # Committed aggregate results (no user data), read-only from the checkout.
      - key: BENCHMARK_RESULTS_DIR
        value: ../results/published/benchmark-results
      - key: ML_RESULTS_DIR
        value: ../results/published/ml-results
      # Optional: live Electricity Maps data. Leave empty for the synthetic demo trace only.
      - key: ELECTRICITY_MAPS_API_KEY
        sync: false
      - key: EM_MAX_CALLS_PER_HOUR
        value: "60"
      - key: EM_MAX_CALLS_PER_DAY
        value: "500"

  - type: web
    name: carbonroute-staging-web
    runtime: static
    branch: fix/prototype-flaws
    autoDeployTrigger: off
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      # The API service URL, e.g. https://carbonroute-staging-api.onrender.com (no /api, no slash).
      - key: VITE_API_URL
        sync: false
    routes:
      # Single-page app: every path serves index.html (React Router handles it).
      - type: rewrite
        source: /*
        destination: /index.html
